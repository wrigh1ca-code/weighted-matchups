name: Update data and deploy site

on:
  schedule:
    - cron: "17 13 * * *"     # daily, ~6:17 AM Mountain: new results, lines and forecasts
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**.html", "site/**.js", "site/**.css", "engine/**.py", "pipeline/**.py", ".github/workflows/update-site.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Refresh current-season data
        if: github.event_name != 'push'
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python -m pipeline.build_season
      - name: Game flow (average lead, game control) for any season missing it
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python -m pipeline.game_flow --backfill
      - name: Team colors (one API call per season, skipped once saved)
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python -m pipeline.team_colors
      - name: Export matchup pages data
        run: python -m engine.export_site
      - name: Commit derived and site data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived site/data
          git diff --cached --quiet || git commit -m "Update data and matchups ($(date -u +%F))"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

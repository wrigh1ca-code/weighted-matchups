name: Build season data

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Seasons to build, space-separated"
        default: "2026"

permissions:
  contents: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build derived unit-game stats
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python -m pipeline.build_season ${{ inputs.years }}
      - name: Commit derived data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived
          git diff --cached --quiet || git commit -m "Update derived data (${{ inputs.years }})"
          git push
